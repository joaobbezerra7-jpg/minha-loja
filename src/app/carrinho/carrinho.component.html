<div class="carrinho-container">

  <h1>Meu Carrinho</h1>

  <div class="carrinho-conteudo">

    <div class="produtos">

      <div class="produto">

        <div class="produto-info">
          <h2>Produto de exemplo</h2>
          <p>Descrição do produto</p>
          <span>R$ 100,00</span>
        </div>

        <div class="quantidade">

          <button type="button">−</button>

          <span>1</span>

          <button type="button">+</button>

        </div>

        <button class="remover" type="button">
          Remover
        </button>

      </div>

    </div>


    <div class="resumo">

      <h2>Resumo do pedido</h2>

      <div class="linha">
        <span>Subtotal</span>
        <span>R$ 100,00</span>
      </div>

      <div class="linha">
        <span>Frete</span>
        <span>Grátis</span>
      </div>

      <hr>

      <div class="total">
        <span>Total</span>
        <strong>R$ 100,00</strong>
      </div>

      <button class="finalizar" type="button">
        Finalizar pedido
      </button>

    </div>

  </div>

</div>
