<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <form>
    <div class="form-card">
     <header class="form-header">
        <h2>Cadastro de Pessoa</h2>
        <p>Preencha os dados abaixo.</p>
      
    
    <div class="field-group">
        <label for="nome">Nome Completo </label>
        <input id="nome" type="text" formControlName="nome" 
         placeholder="Ex: João Batista" required>
    </div>

    <div class="field-group">
        <label for="email">E-mail </label>
        <input id="email" type="email" formControlName="email" 
         placeholder="Ex: seu@email.com" required>
    </div>

    <div class="field-group">
        <label for="cpf">  CPF </label>
        <input id="cpf" type="text" formControlName="cpf" mask="000.000.000.00" 
         placeholder="Ex: 000.000.000.00" required>
    </div>
    </form>
     </header>
     npm install -g @angular/cli@latest
    </div>

     <div class="field-group">
        <label for="cep"> CEP</label>
        <div class="input-wrapper">
            <input id="cep" type="text" formControlName="cep" mask="00000-000" placeholder="00000-000"
            [class.is-invalid]="campoInvalido(cep)">
            <span ></span>
        </div>
     </div>

    </form>
</body>
</html>
