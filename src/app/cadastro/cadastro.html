<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Loja de Componentes de Hardware</title>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-header">
            <h2>Criar Conta</h2>
            <p>Preencha seus dados para realizar compras de hardware</p>
        </div>

        <form id="formCadastro" class="form-grid">
            
            <!-- Dados Pessoais -->
            <div class="form-group full-width">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: João da Silva">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecione...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
            </div>

            <!-- Dados de Acesso -->
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="6" required placeholder="Mínimo 6 caracteres">
            </div>

            <!-- Endereço com Busca via CEP -->
            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" maxlength="9" required placeholder="00000-000">
                <span id="cepStatus" class="cep-status"></span>
            </div>

            <div class="form-group full-width address-subgrid">
                <div>
                    <label for="logradouro">Rua / Logradouro</label>
                    <input type="text" id="logradouro" name="logradouro" required placeholder="Rua, Avenida...">
                </div>
                <div>
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" required placeholder="123">
                </div>
            </div>

            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required placeholder="Bairro">
            </div>

            <div class="form-group uf-cidade-grid">
                <div>
                    <label for="uf">UF</label>
                    <input type="text" id="uf" name="uf" maxlength="2" required placeholder="SP">
                </div>
                <div>
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required placeholder="Cidade">
                </div>
            </div>

            <!-- Submissão -->
            <div class="form-group full-width form-actions">
                <button type="submit" class="btn-submit">Cadastrar</button>
                <p class="login-link">Já possui uma conta? <a href="login.html">Fazer Login</a></p>
            </div>

        </form>
    </div>

</body>
</html>
