<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pessoa</title>
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-header">
            <h2>Criar Conta</h2>
            <p>Preencha os dados abaixo</p>
        </div>


        <!-- FORMULÁRIO ANGULAR -->
        <form
            id="formCadastro"
            class="form-grid"
            [formGroup]="cadastroForm"
            (ngSubmit)="onSubmit()"
        >

            <!-- =============================== -->
            <!-- DADOS PESSOAIS -->
            <!-- =============================== -->

            <div class="form-group full-width">

                <label for="nome">
                    Nome Completo
                </label>

                <input
                    type="text"
                    id="nome"
                    formControlName="nome"
                    required
                    placeholder="Ex: João Batista"
                >

            </div>


            <div class="form-group">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    formControlName="cpf"
                    maxlength="11"
                    required
                    placeholder="000.000.000-00"
                >

            </div>


            <div class="form-group">

                <label for="data_nascimento">
                    Data de Nascimento
                </label>

                <input
                    type="date"
                    id="data_nascimento"
                    formControlName="data_nascimento"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    formControlName="telefone"
                    maxlength="11"
                    required
                    placeholder="(00) 00000-0000"
                >

            </div>


            <!-- =============================== -->
            <!-- DADOS DE ACESSO -->
            <!-- =============================== -->

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    formControlName="email"
                    required
                    placeholder="seu@email.com"
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    formControlName="senha"
                    minlength="6"
                    required
                    placeholder="Mínimo 6 caracteres"
                >

            </div>


            <!-- =============================== -->
            <!-- CEP -->
            <!-- =============================== -->

            <div class="form-group">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    formControlName="cep"
                    (blur)="buscarCep()"
                    maxlength="8"
                    placeholder="00000000"
                >

                <span [class]="cepStatusClasse">
                    {{ cepStatusMensagem }}
                </span>

            </div>


            <!-- =============================== -->
            <!-- LOGRADOURO E NÚMERO -->
            <!-- =============================== -->

            <div class="form-group full-width address-subgrid">

                <div>

                    <label for="logradouro">
                        Rua / Logradouro
                    </label>

                    <input
                        type="text"
                        id="logradouro"
                        formControlName="logradouro"
                        required
                        placeholder="Rua, Avenida..."
                    >

                </div>


                <div>

                    <label for="numero">
                        Número
                    </label>

                    <input
                        type="text"
                        id="numero"
                        formControlName="numero"
                        required
                        placeholder="123"
                    >

                </div>

            </div>


            <!-- =============================== -->
            <!-- BAIRRO -->
            <!-- =============================== -->

            <div class="form-group">

                <label for="bairro">
                    Bairro
                </label>

                <input
                    type="text"
                    id="bairro"
                    formControlName="bairro"
                    required
                    placeholder="Bairro"
                >

            </div>


            <!-- =============================== -->
            <!-- UF E CIDADE -->
            <!-- =============================== -->

            <div class="form-group uf-cidade-grid">

                <div>

                    <label for="uf">
                        UF
                    </label>

                    <input
                        type="text"
                        id="uf"
                        formControlName="uf"
                        maxlength="2"
                        required
                        placeholder="SE"
                    >

                </div>


                <div>

                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        formControlName="cidade"
                        required
                        placeholder="Cidade"
                    >

                </div>

            </div>


            <!-- =============================== -->
            <!-- MENSAGENS -->
            <!-- =============================== -->

            <div
                class="form-group full-width"
                *ngIf="errorMessage"
            >

                <p class="status-erro">
                    {{ errorMessage }}
                </p>

            </div>


            <div
                class="form-group full-width"
                *ngIf="successMessage"
            >

                <p class="status-sucesso">
                    {{ successMessage }}
                </p>

            </div>


            <!-- =============================== -->
            <!-- BOTÃO -->
            <!-- =============================== -->

            <div class="form-group full-width form-actions">

                <button
                    type="submit"
                    class="btn-submit"
                    [disabled]="loading"
                >

                    {{ loading ? 'Cadastrando...' : 'Cadastrar' }}

                </button>


                <p class="cadastro-link">

                    Já possui uma conta?

                    <a
                        href="javascript:void(0)"
                        (click)="irParaLogin()"
                    >
                        Fazer Login
                    </a>

                </p>

            </div>

        </form>

    </div>

</body>

</html>
