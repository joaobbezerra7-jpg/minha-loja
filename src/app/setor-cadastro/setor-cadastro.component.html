<div style="max-width: 600px; margin: 20px auto; font-family: sans-serif;">
  <h2>{{ setorEmEdicao ? 'Editar Categoria' : 'Cadastro de Setor / Categoria' }}</h2>

  <form [formGroup]="formSetor" (ngSubmit)="onSubmit()" style="margin-bottom: 20px;">
    <div style="margin-bottom: 10px;">
      <label>Nome do Setor:</label><br />
      <input type="text" formControlName="nome" placeholder="Ex: Hardware, Periféricos" style="width: 100%; padding: 8px; margin-top: 4px;" />
    </div>

    <button type="submit" [disabled]="formSetor.invalid" style="padding: 8px 16px; cursor: pointer;">
      {{ setorEmEdicao ? 'Salvar Alteração' : 'Cadastrar Setor' }}
    </button>

    <button *ngIf="setorEmEdicao" type="button" (click)="cancelarEdicao()" style="margin-left: 8px; padding: 8px 16px; cursor: pointer;">
      Cancelar
    </button>
  </form>

  <p *ngIf="mensagemSucesso" style="color: green; font-weight: bold;">{{ mensagemSucesso }}</p>

  <hr />

  <h3>Categorias Cadastradas</h3>
  <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th>ID</th>
        <th>Nome da Categoria</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let setor of listaSetores">
        <td>{{ setor.idsetor }}</td>
        <td>{{ setor.nome }}</td>
        <td>
          <button (click)="prepararEdicao(setor)" style="margin-right: 5px; cursor: pointer;">Editar</button>
          <button (click)="excluir(setor.idsetor)" style="color: red; cursor: pointer;">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
